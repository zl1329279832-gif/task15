<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧泵站运行态势系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header id="header">
      <div id="header-left">
        <h1>智慧泵站运行态势系统</h1>
        <span id="header-clock"></span>
      </div>
      <div id="scene-buttons">
        <button data-scene="normal">正常运行</button>
        <button data-scene="highLevel">液位过高</button>
        <button data-scene="pumpFault">泵组故障</button>
        <button data-scene="sensorOffline">传感器离线</button>
        <button data-scene="nightLow">夜间低负载</button>
      </div>
    </header>

    <!-- 主区域 -->
    <main id="main">
      <!-- Canvas -->
      <div id="canvas-wrap">
        <canvas id="station-canvas"></canvas>
        <div id="scenario-bar">
          <span id="scenario-label">所有设备正常运行，水位正常</span>
        </div>
      </div>

      <!-- 侧边面板 -->
      <aside id="side-panel">
        <div id="panel-header">
          <h2 id="panel-title">设备详情</h2>
          <button id="panel-close">&times;</button>
        </div>
        <div id="panel-status"></div>
        <div id="panel-data"></div>
      </aside>
    </main>

    <!-- 底部告警栏 -->
    <footer id="alarm-bar">
      <div id="alarm-header">
        <div id="alarm-title-area">
          <span>告警信息</span>
          <span id="alarm-count" class="alarm-badge">0</span>
        </div>
        <span id="alarm-toggle">&#9660;</span>
      </div>
      <div id="alarm-list">
        <div class="alarm-empty">系统运行正常，无告警</div>
      </div>
    </footer>
  </div>

  <!-- 脚本按依赖顺序加载 -->
  <script src="js/config.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
