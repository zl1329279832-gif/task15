<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧泵站运行态势系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header">
    <div class="header-left">
      <h1>智慧泵站运行态势系统</h1>
      <span class="header-sub" id="headerTime"></span>
    </div>
    <div class="header-right">
      <div class="header-stat"><span class="stat-label">设备总数</span><span class="stat-val" id="statTotal">0</span></div>
      <div class="header-stat"><span class="stat-label">运行中</span><span class="stat-val running" id="statRunning">0</span></div>
      <div class="header-stat"><span class="stat-label">告警</span><span class="stat-val fault" id="statAlarm">0</span></div>
      <div class="header-stat"><span class="stat-label">FPS</span><span class="stat-val" id="statFPS">--</span></div>
    </div>
  </header>
  <div id="main">
    <div id="canvasWrap">
      <canvas id="scene"></canvas>
      <div id="sceneBar">
        <button class="scene-btn active" data-scene="normal">正常运行</button>
        <button class="scene-btn" data-scene="highLevel">液位过高</button>
        <button class="scene-btn" data-scene="pumpFault">泵组故障</button>
        <button class="scene-btn" data-scene="sensorOffline">传感器离线</button>
        <button class="scene-btn" data-scene="nightLowLoad">夜间低负载</button>
      </div>
    </div>
    <aside id="panel">
      <div class="panel-section" id="panelInfo">
        <h2>设备信息</h2>
        <div id="panelContent" class="panel-placeholder">点击画布中的设备查看详情</div>
      </div>
      <div class="panel-section" id="panelAlarm">
        <h2>告警列表</h2>
        <ul id="alarmList"></ul>
      </div>
    </aside>
  </div>
  <footer id="footer">
    <span id="sceneLabel">当前场景：正常运行</span>
    <span id="perfInfo"></span>
    <span>v1.0.0</span>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
